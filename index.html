<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <h2 class="scoreboard" id="homecount-el">0</h2>
                <span class="scoreplus">
                    <button class="points" onclick="onepoints()">+1</button>
                    <button class="points" onclick="twopoints()">+2</button>
                    <button class="points" onclick="threepoints()">+3</button>
            </div>
            <div>
                <h3>AWAY</h3>
                <h2 class="scoreboard" id="guestcount-el">0</h2>
                <span class="scoreplus">
                    <button class="points" onclick="onepointsguest()">+1</button>
                    <button class="points" onclick="twopointsguest()">+2</button>
                    <button class="points" onclick="threepointsguest()">+3</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
